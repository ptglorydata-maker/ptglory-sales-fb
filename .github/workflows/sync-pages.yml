name: Sync Pages Data

on:
  schedule:
    # ทุก 20 นาที ตลอดวัน — repo นี้เป็น public จึงใช้ GitHub Actions minutes ได้ไม่จำกัด/ฟรี ไม่มีเพดานรายเดือน
    # (ปรับความถี่ได้ตรงนี้) เดิมตั้งไว้ทุก 5 นาที แต่หลังเพิ่มการ sync แท็บ "Adminชื่อ" รายบุคคล
    # (ยูนิตนึงมีได้ 10+ แท็บ) รอบนึงใช้เวลาจริง ~15-17 นาที (เจอ rate limit ของ Google Sheets API
    # บ่อยขึ้นเพราะอ่านมากขึ้นมาก) ถ้ายังตั้งทุก 5 นาที รอบใหม่จะมาต่อคิว (concurrency guard ด้านล่าง
    # กันไม่ให้เขียนชนกัน) จนข้อมูลล้าหลังกว่าตั้งความถี่ให้สมจริงตั้งแต่แรก
    # หมายเหตุ: cron ของ GitHub Actions เป็น "best effort" ช่วงที่ระบบ GitHub โหลดสูงอาจดีเลย์ได้ 2-10 นาที
    - cron: '*/20 * * * *'
  workflow_dispatch: {} # กดรันเองจากแท็บ Actions ได้ด้วย (ไว้ทดสอบ)

# กันรอบใหม่รันซ้อนรอบเก่าที่ยังไม่เสร็จ (เผื่อ sync หนึ่งรอบใช้เวลานานกว่า 5 นาที) — ให้รอบที่รันอยู่
# ทำต่อจนจบ ส่วนรอบที่ค้างคิวไว้ (ยังไม่เริ่ม) จะถูกแทนที่ด้วยรอบล่าสุดเสมอ ไม่มีการเขียนชีตพร้อมกัน 2 รอบ
concurrency:
  group: sync-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Write service account credentials
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Sync all units to Staging Sheet
        working-directory: etl
        run: python sync_pages.py --all
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/service-account.json
